# aron.best inbound hardening for the macOS packet filter (pf).
# Loaded as the "aron.best" anchor from /etc/pf.conf by deploy/pf/install-pf.sh.
#
# What it does: caps connections and connection rates per source address on
# the three forwarded listeners and drops a source that trips a limit.
# What it cannot do: stop a volumetric attack that fills the GFiber link.
#
# Plain "keep state" is used on purpose. A "synproxy state" variant was in
# place on September 21, 2026 when the Mac hit a kernel panic in the network
# locking path while its Wi-Fi interface was cycled; it has not been proven
# to be the cause, but SYN proxying buys little behind a residential router
# and is not worth that risk.

ext_if = "en0"
web_ports = "{ 80, 443 }"
mc_port = "25565"

# Sources that tripped a limit. Entries expire through the periodic
# "pfctl -t aron_flooders -T expire" job installed next to this file.
table <aron_flooders> persist

block in quick on $ext_if from <aron_flooders> to any

# Web: 40 open connections per source, 30 new connections per 5 seconds.
pass in on $ext_if proto tcp to any port $web_ports flags S/SA keep state \
    (max-src-conn 40, max-src-conn-rate 30/5, overload <aron_flooders> flush global)

# Minecraft: 6 open connections per source, 10 new connections per 10 seconds,
# matching the application gateway's own per-address cap.
pass in on $ext_if proto tcp to any port $mc_port flags S/SA keep state \
    (max-src-conn 6, max-src-conn-rate 10/10, overload <aron_flooders> flush global)
