name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check service scripts
        run: |
          node --check scripts/install-services.mjs
          node --check deploy/run-service.mjs
          node --check deploy/router-mappings.mjs
          node --check deploy/launch-agents.mjs
          node --test deploy/run-service.test.mjs deploy/router-mappings.test.mjs deploy/launch-agents.test.mjs
      - name: Check container deployment tools
        run: |
          node --check scripts/docker-prepare.mjs
          node --check scripts/docker-state.mjs
          node --check scripts/docker-invite.mjs
          node --check scripts/docker-smoke.mjs
          node --check scripts/docker-ui-smoke.mjs
          node --check scripts/version-selector-ui-smoke.mjs
          node --check scripts/saved-servers-ui-smoke.mjs
          node --check scripts/docker-profiles-smoke.mjs
          node --test deploy/docker/*.test.mjs
      - name: Build isolated services
        run: docker compose build app minecraft network-edge caddy
      - name: Test portable state transfer
        env:
          DOCKER_INTEGRATION: 'true'
        run: node --test deploy/docker/state.test.mjs
