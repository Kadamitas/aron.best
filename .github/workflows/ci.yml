name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check service scripts
        run: |
          node --check scripts/install-services.mjs
          node --check deploy/run-service.mjs
          node --check deploy/router-mappings.mjs
          node --check deploy/launch-agents.mjs
          node --test deploy/run-service.test.mjs deploy/router-mappings.test.mjs deploy/launch-agents.test.mjs
